<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="50" y1="30" x2="350" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="240" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>

  <!-- Desk -->
  <rect x="0" y="240" width="400" height="60" rx="0" fill="url(#deskGrad)"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>

  <!-- Monitor -->
  <rect x="70" y="30" width="260" height="170" rx="12" fill="#1a1a2e" stroke="#2d3748" stroke-width="2"/>
  <rect x="80" y="40" width="240" height="150" rx="8" fill="url(#screenGrad)"/>
  
  <!-- Monitor stand -->
  <rect x="175" y="200" width="50" height="20" fill="#2d3748"/>
  <rect x="150" y="218" width="100" height="8" rx="4" fill="#2d3748"/>

  <!-- Screen content - code lines with animation -->
  <g font-family="'Courier New', monospace" font-size="10">
    <!-- Line 1 -->
    <text x="95" y="60" fill="#7c3aed" opacity="0">from</text>
    <text x="125" y="60" fill="#00d4ff" opacity="0">django</text>
    <text x="170" y="60" fill="#7c3aed" opacity="0">import</text>
    <text x="210" y="60" fill="#5eead4" opacity="0">views</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    
    <!-- Line 2 -->
    <g opacity="0">
      <text x="95" y="76" fill="#7c3aed">class</text>
      <text x="125" y="76" fill="#fbbf24">ApiView</text>
      <text x="175" y="76" fill="#f8fafc" opacity="0.6">:</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
    </g>

    <!-- Line 3 -->
    <g opacity="0">
      <text x="110" y="92" fill="#7c3aed">def</text>
      <text x="135" y="92" fill="#5eead4">get</text>
      <text x="155" y="92" fill="#f8fafc" opacity="0.6">(self, req):</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
    </g>

    <!-- Line 4 -->
    <g opacity="0">
      <text x="125" y="108" fill="#ec4899">return</text>
      <text x="165" y="108" fill="#00d4ff">Response</text>
      <text x="215" y="108" fill="#f8fafc" opacity="0.6">(</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2s" fill="freeze"/>
    </g>

    <!-- Line 5 -->
    <g opacity="0">
      <text x="140" y="124" fill="#fbbf24">"status"</text>
      <text x="195" y="124" fill="#f8fafc" opacity="0.6">:</text>
      <text x="205" y="124" fill="#22c55e">"success"</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
    </g>

    <!-- Line 6 -->
    <g opacity="0">
      <text x="125" y="140" fill="#f8fafc" opacity="0.6">)</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/>
    </g>
  </g>

  <!-- Blinking cursor on screen -->
  <rect x="137" y="144" width="7" height="12" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Screen reflection glow -->
  <rect x="80" y="40" width="240" height="150" rx="8" fill="#00d4ff" opacity="0.02">
    <animate attributeName="opacity" values="0.02;0.05;0.02" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Desk lamp -->
  <line x1="340" y1="240" x2="355" y2="120" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <line x1="355" y1="120" x2="330" y2="100" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="322" cy="98" rx="18" ry="10" fill="#fbbf24" opacity="0.8"/>
  <circle cx="322" cy="140" r="50" fill="url(#lampGlow)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Coffee cup -->
  <rect x="30" y="248" width="24" height="20" rx="3" fill="#3d2b1f" stroke="#5a3e28" stroke-width="1"/>
  <path d="M54 252C62 252 64 260 54 264" stroke="#5a3e28" stroke-width="1.5" fill="none"/>
  <!-- Steam -->
  <path d="M38 248C38 238 42 238 42 228" stroke="#6b7280" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <animate attributeName="d" values="M38 248C38 238 42 238 42 228;M38 248C34 238 38 238 42 228;M38 248C38 238 42 238 42 228" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M46 248C46 240 50 240 50 232" stroke="#6b7280" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <animate attributeName="d" values="M46 248C46 240 50 240 50 232;M46 248C42 240 46 240 50 232;M46 248C46 240 50 240 50 232" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Keyboard -->
  <rect x="120" y="250" width="160" height="25" rx="4" fill="#1a1a2e" stroke="#2d3748" stroke-width="1"/>
  <g fill="#2d3748">
    <rect x="128" y="254" width="12" height="7" rx="1.5"/>
    <rect x="144" y="254" width="12" height="7" rx="1.5"/>
    <rect x="160" y="254" width="12" height="7" rx="1.5"/>
    <rect x="176" y="254" width="12" height="7" rx="1.5"/>
    <rect x="192" y="254" width="12" height="7" rx="1.5"/>
    <rect x="208" y="254" width="12" height="7" rx="1.5"/>
    <rect x="224" y="254" width="12" height="7" rx="1.5"/>
    <rect x="240" y="254" width="12" height="7" rx="1.5"/>
    <rect x="256" y="254" width="12" height="7" rx="1.5"/>
    <rect x="132" y="264" width="12" height="7" rx="1.5"/>
    <rect x="148" y="264" width="12" height="7" rx="1.5"/>
    <rect x="164" y="264" width="12" height="7" rx="1.5"/>
    <rect x="180" y="264" width="12" height="7" rx="1.5"/>
    <rect x="196" y="264" width="12" height="7" rx="1.5"/>
    <rect x="212" y="264" width="12" height="7" rx="1.5"/>
    <rect x="228" y="264" width="12" height="7" rx="1.5"/>
    <rect x="244" y="264" width="12" height="7" rx="1.5"/>
  </g>

  <!-- Animated key press -->
  <rect x="176" y="254" width="12" height="7" rx="1.5" fill="#00d4ff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="0.8s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="196" y="264" width="12" height="7" rx="1.5" fill="#a855f7" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="0.8s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="148" y="264" width="12" height="7" rx="1.5" fill="#5eead4" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="0.8s" begin="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Mouse -->
  <ellipse cx="310" cy="262" rx="12" ry="16" fill="#1a1a2e" stroke="#2d3748" stroke-width="1"/>
  <line x1="310" y1="252" x2="310" y2="260" stroke="#2d3748" stroke-width="0.5"/>
</svg>
