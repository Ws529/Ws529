<svg width="360" height="200" viewBox="0 0 360 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="360" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="360" height="200" rx="16" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="360" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
  <!-- Icon -->
  <rect x="24" y="24" width="48" height="48" rx="12" fill="#0a0a1a" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="48" y="56" fill="#00d4ff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" text-anchor="middle">📊</text>
  <!-- Title -->
  <text x="84" y="42" fill="#f0f6fc" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700">SIM-MPP</text>
  <!-- Badge -->
  <rect x="84" y="50" width="60" height="18" rx="9" fill="#092E20" opacity="0.8"/>
  <text x="114" y="63" fill="#5eead4" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Django</text>
  <!-- Description -->
  <text x="24" y="100" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Platform manajemen untuk operasi</text>
  <text x="24" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">internal dan alur kerja terstruktur.</text>
  <!-- Stats -->
  <circle cx="32" cy="160" r="4" fill="#22c55e" opacity="0.8"/>
  <text x="42" y="164" fill="#6b7280" font-family="'Segoe UI', sans-serif" font-size="11">Python</text>
  <!-- Bottom glow -->
  <rect x="80" y="195" width="200" height="5" rx="2.5" fill="#00d4ff" opacity="0.1" filter="url(#glow)"/>
</svg>
